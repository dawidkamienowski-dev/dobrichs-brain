name: DobrichsBrain
options:
  bundleIdPrefix: dev.dobrich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DobrichsBrain:
    type: application
    platform: iOS
    sources: [DobrichsBrain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dobrich.brain
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Dobrich’s Brain"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  DobrichsBrainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DobrichsBrainUITests]
    dependencies:
      - target: DobrichsBrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dobrich.brain.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DobrichsBrain
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DobrichsBrain:
    build:
      targets:
        DobrichsBrain: all
        DobrichsBrainUITests: [test]
    test:
      targets: [DobrichsBrainUITests]
