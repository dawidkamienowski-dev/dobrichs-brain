name: DobrichsBrain
options:
  bundleIdPrefix: dev.dobrich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DobrichsBrain:
    type: application
    platform: iOS
    sources: [DobrichsBrain, Shared]
    dependencies:
      - target: DobrichsBrainWidgets
    entitlements:
      path: DobrichsBrain/DobrichsBrain.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.dobrich.brain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dobrich.brain
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Dobrich’s Brain"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  DobrichsBrainWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "Dobrich’s Brain"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.dobrich.brain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dobrich.brain.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  DobrichsBrainUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DobrichsBrainUITests]
    dependencies:
      - target: DobrichsBrain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dobrich.brain.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DobrichsBrain
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  DobrichsBrain:
    build:
      targets:
        DobrichsBrain: all
        DobrichsBrainUITests: [test]
    test:
      targets: [DobrichsBrainUITests]
